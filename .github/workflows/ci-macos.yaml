name: CI (macOS)

on:
  push:
    branches: ["main"]
  pull_request:
    branches:
      - '*'

jobs:
  build-test:
    runs-on: macos-14
    strategy:
      matrix:
        # v2406 is excluded: its ISpanStream.H relies on a libstdc++-only
        # default constructor for std::istream that Apple's libc++ rejects.
        # This is an upstream OpenFOAM bug (fixed in later releases), and the
        # OpenFOAM install on macOS runners is a read-only mounted disk image,
        # so it can't be patched around at CI time either.
        openfoam-version: [2312, 2412, 2506, 2512]
        include:
          - openfoam-version: 2312
            allow-failure: true
      fail-fast: false
    continue-on-error: ${{ matrix.allow-failure == true }}
    name: Test with OpenFOAM ${{ matrix.openfoam-version }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up OpenFOAM
        uses: gerlero/setup-openfoam@v1
        with:
          openfoam-version: ${{ matrix.openfoam-version }}
      - name: Install Python and dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Build package
        run: |
          pip install .[dev]

      - name: Run tests
        run: |
          pytest
        env:
          DYLD_LIBRARY_PATH: ${{ env.FOAM_LD_LIBRARY_PATH }}
